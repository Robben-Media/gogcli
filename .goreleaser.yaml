version: 2

project_name: google-mcp

changelog:
  disable: true

builds:
  - id: gog_mcp
    main: ./cmd/gog-mcp
    binary: gog-mcp
    ldflags: -s -w
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: gog_mcp_darwin
    main: ./cmd/gog-mcp
    binary: gog-mcp
    ldflags: -s -w
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - builds:
      - gog_mcp
      - gog_mcp_darwin
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
